name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_id:        { description: "Sitely build id",     required: true }
      site_id:         { description: "Sitely site id",      required: true }
      site_url:        { description: "URL to wrap",         required: true }
      app_name:        { description: "App display name",    required: true }
      package_id:      { description: "Android package id",  required: true }
      icon_url:        { description: "Icon URL (png)",      required: false, default: "" }
      splash_url:      { description: "Splash image URL",    required: false, default: "" }
      splash_color:    { description: "Splash bg color",     required: false, default: "#0B0B1A" }
      theme_color:     { description: "Theme color",         required: false, default: "#4F46E5" }
      native_json:     { description: "Native opts JSON (redirect_scheme, external_links, expects_google_auth)", required: false, default: "{}" }
      callback_url:    { description: "Sitely webhook URL",  required: true }
      callback_secret: { description: "Shared webhook secret", required: true }

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - uses: actions/setup-java@v4
        with: { distribution: "temurin", java-version: "17" }

      # No dependency cache for the Android project: `android/` is generated
      # fresh by `cap add android` on every run, so res/ can never be stale.
      - name: Install deps
        run: npm install

      # 1. Config + download this build's icon/splash. Fails hard on a bad URL.
      - name: Prepare Capacitor config & download assets
        env:
          BUILD_ID:     ${{ inputs.build_id }}
          APP_NAME:     ${{ inputs.app_name }}
          PACKAGE_ID:   ${{ inputs.package_id }}
          SITE_URL:     ${{ inputs.site_url }}
          ICON_URL:     ${{ inputs.icon_url }}
          SPLASH_URL:   ${{ inputs.splash_url }}
          SPLASH_COLOR: ${{ inputs.splash_color }}
          THEME_COLOR:  ${{ inputs.theme_color }}
          NATIVE_JSON:  ${{ inputs.native_json }}
        run: node scripts/prepare.mjs

      # 2. Scaffold the Android project (writes DEFAULT Capacitor icons).
      - name: Add Android platform
        run: npx cap add android && npx cap sync android

      # 3. Overwrite every launcher/splash resource with this build's assets.
      #    Sequential by design: gradle never runs before this completes.
      - name: Apply generated icon & splash resources
        run: node scripts/apply-assets.mjs

      # 3b. Wire the in-app link handler + Custom Tabs OAuth layer.
      - name: Apply native link & OAuth layer
        env:
          SITE_URL:   ${{ inputs.site_url }}
          PACKAGE_ID: ${{ inputs.package_id }}
          APP_NAME:   ${{ inputs.app_name }}
        run: node scripts/apply-native.mjs

      # 4. Hard gate: on-disk resources must hash-match the generated assets.
      - name: Validate icon & splash resources
        run: node scripts/verify-assets.mjs

      - name: Validate native OAuth / link wiring
        env:
          PACKAGE_ID: ${{ inputs.package_id }}
        run: node scripts/verify-native.mjs

      - name: Show launcher resources (diagnostics)
        run: |
          ls -l android/app/src/main/res/mipmap-*/ || true
          ls -l android/app/src/main/res/drawable*/splash.png || true
          cat asset-manifest.json

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/${{ inputs.build_id }}.apk"

      # 5. Post-compile proof: the icon inside the APK must match the resource
      #    we generated, so a packaging quirk can't reintroduce the default.
      - name: Verify icon inside the APK
        run: node scripts/verify-apk.mjs "out/${{ inputs.build_id }}.apk"

      # 6. Post-compile proof for the OAuth layer.
      - name: Verify OAuth wiring inside the APK
        run: node scripts/verify-apk-oauth.mjs "out/${{ inputs.build_id }}.apk"

      - name: Publish APK as GitHub Release asset
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ inputs.build_id }}
          name: "${{ inputs.app_name }} (${{ inputs.build_id }})"
          body: |
            APK for **${{ inputs.app_name }}**
            Source: ${{ inputs.site_url }}
            Sitely build id: `${{ inputs.build_id }}`
          files: out/${{ inputs.build_id }}.apk
          fail_on_unmatched_files: true

      - name: Compute APK URL
        run: |
          APK_URL="https://github.com/${{ github.repository }}/releases/download/build-${{ inputs.build_id }}/${{ inputs.build_id }}.apk"
          echo "APK_URL=$APK_URL" >> $GITHUB_ENV

      - name: Notify Sitely (success)
        if: success()
        run: |
          curl -fsS -X POST "${{ inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -H "X-Sitely-Secret: ${{ inputs.callback_secret }}" \
            -d "{\"build_id\":\"${{ inputs.build_id }}\",\"status\":\"ready\",\"apk_url\":\"${APK_URL}\",\"github_run_id\":\"${{ github.run_id }}\"}"

      - name: Notify Sitely (failure)
        if: failure()
        run: |
          curl -fsS -X POST "${{ inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -H "X-Sitely-Secret: ${{ inputs.callback_secret }}" \
            -d "{\"build_id\":\"${{ inputs.build_id }}\",\"status\":\"failed\",\"error_message\":\"Build failed. See run ${{ github.run_id }}.\",\"github_run_id\":\"${{ github.run_id }}\"}"
